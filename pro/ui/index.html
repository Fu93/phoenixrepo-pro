<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhoenixRepo Pro</title>
  <style>
    :root {
      --ink: #1c1612;
      --paper: #f4efe6;
      --card: #fffaf3;
      --ember: #c2410c;
      --ember-deep: #9a3412;
      --moss: #3f6212;
      --rose: #9f1239;
      --amber: #a16207;
      --line: #e6d9c8;
      --mute: #6d6258;
      --shadow: 0 18px 50px rgba(60, 32, 12, 0.08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% -10%, #ffe7d4 0%, transparent 55%),
        radial-gradient(700px 380px at 100% 0%, #f3e7c9 0%, transparent 50%),
        var(--paper);
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
      line-height: 1.5;
    }
    a { color: var(--ember-deep); }
    button, input { font: inherit; }
    .wrap { width: min(1080px, calc(100% - 32px)); margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 22px 0 8px;
    }
    .brand { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
    .mark {
      width: 36px; height: 36px; border-radius: 50%;
      background: conic-gradient(from 210deg, #fdba74, var(--ember), #7c2d12, #fdba74);
      box-shadow: inset 0 0 0 6px #fff6ee;
    }
    .brand b { display: block; letter-spacing: 0.14em; font-size: 0.78rem; }
    .brand span { color: var(--mute); font-size: 0.92rem; }
    nav { display: flex; gap: 14px; align-items: center; }
    nav a { text-decoration: none; color: var(--ink); }
    .mono, code, .hash { font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", Menlo, Consolas, monospace; }
    h1 { font-size: clamp(2.2rem, 5vw, 4.4rem); line-height: 0.95; font-weight: 600; margin: 12px 0; letter-spacing: -0.03em; }
    h2 { font-size: 1.45rem; margin: 0 0 8px; }
    .lede { font-size: 1.18rem; max-width: 42rem; }
    .muted { color: var(--mute); }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
    }
    form.judge { display: flex; gap: 8px; margin: 18px 0; }
    form.judge input {
      flex: 1;
      border: 1px solid #d9cbb8;
      background: #fff;
      border-radius: 999px;
      padding: 14px 18px;
      min-width: 0;
    }
    form.judge button, .btn {
      border: 0;
      background: var(--ink);
      color: #fffaf3;
      border-radius: 999px;
      padding: 12px 18px;
      cursor: pointer;
    }
    .btn.secondary { background: transparent; color: var(--ink); border: 1px solid #d9cbb8; }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      text-decoration: none;
      color: inherit;
    }
    .grid { display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 16px; }
    .stack { display: grid; gap: 16px; }
    .stamp {
      display: inline-block;
      border: 3px solid currentColor;
      padding: 6px 12px;
      letter-spacing: 0.12em;
      font-weight: 700;
      transform: rotate(-2deg);
      text-transform: uppercase;
    }
    .stamp.CANDIDATE { color: var(--moss); }
    .stamp.ALREADY_EXISTS { color: var(--rose); }
    .stamp.NEEDS_REVIEW, .stamp.NEEDS_PRIOR_ART, .stamp.UNJUDGED { color: var(--amber); }
    blockquote {
      margin: 0;
      padding: 8px 0 8px 14px;
      border-left: 3px solid var(--ember);
      font-size: 1.15rem;
    }
    .log { list-style: none; margin: 0; padding: 0; }
    .log li { display: grid; grid-template-columns: 16px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
    .log li::before { content: ""; width: 8px; height: 8px; margin-top: 8px; border-radius: 50%; background: var(--ember); }
    .alt { padding: 12px 0; border-top: 1px solid var(--line); }
    .tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem; letter-spacing: 0.08em; }
    .tag.blocked { color: var(--rose); }
    .tag.open { color: var(--moss); }
    .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .item { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
    .error { color: var(--rose); }
    footer { color: var(--mute); padding: 28px 0 40px; font-size: 0.92rem; }
    .timeline { border-left: 2px solid #e7c3a8; margin-left: 8px; padding-left: 16px; }
    .timeline article { margin: 0 0 12px; }
    .ok { color: var(--moss); }
    .bad { color: var(--rose); }
    @media (max-width: 800px) {
      .grid, .cols { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
      form.judge { flex-direction: column; }
      form.judge button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/pro">
        <i class="mark" aria-hidden="true"></i>
        <div>
          <b>PHOENIXREPO PRO</b>
          <span>Assay a repository before you revive it</span>
        </div>
      </a>
      <nav>
        <a href="/pro">Judge</a>
        <a href="/pro#responsible">Responsible AI</a>
        <a href="/ui">Recorded replays</a>
      </nav>
    </header>
    <main id="app"></main>
    <footer>
      Type is the browser’s own serif and monospace. No font file and no paid service is loaded.
      The hash chain shows a trace was not edited. It does not show the verdict is true.
    </footer>
  </div>
  <script>
    const app = document.getElementById("app");

    function el(tag, props, children) {
      const node = document.createElement(tag);
      Object.entries(props || {}).forEach(([key, value]) => {
        if (key === "class") node.className = value;
        else if (key.startsWith("on") && typeof value === "function") node.addEventListener(key.slice(2), value);
        else if (value !== false && value != null) node.setAttribute(key, value);
      });
      (children || []).forEach((child) => node.append(child instanceof Node ? child : document.createTextNode(String(child))));
      return node;
    }

    function route() {
      const path = location.pathname.replace(/\/$/, "") || "/";
      const rescue = path.match(/^\/pro\/r\/([^/]+)\/rescue$/);
      const trace = path.match(/^\/pro\/r\/([^/]+)\/trace$/);
      const result = path.match(/^\/pro\/r\/([^/]+)$/);
      if (rescue) return renderResult(decodeURIComponent(rescue[1]), "rescue");
      if (trace) return renderResult(decodeURIComponent(trace[1]), "trace");
      if (result) return renderResult(decodeURIComponent(result[1]), "verdict");
      return renderHome();
    }

    async function renderHome() {
      app.replaceChildren(el("p", { class: "muted" }, ["Loading"]));
      const status = await fetch("/pro/api/status").then((r) => r.json());
      const examples = status.examples || [];
      const form = el("form", { class: "judge" }, [
        el("input", { name: "url", type: "url", required: "true", placeholder: "https://github.com/owner/repository", "aria-label": "Public GitHub repository URL" }),
        el("button", { type: "submit" }, ["Judge"]),
      ]);
      const log = el("ol", { class: "log" });
      const note = el("p", { class: "muted" });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        startRun(new FormData(form).get("url"), log, note, form.querySelector("button"));
      });
      const mode = status.mode === "demo"
        ? "Demo mode. No model key is set, so only the recorded examples run. A live judgement needs NVIDIA_API_KEY, with GEMINI_API_KEY as an optional fallback."
        : `Hosted mode: ${status.mode}. Nightshift is not required. Model ${status.model || "configured"}. Daily cap ${status.limits.global_used}/${status.limits.global_limit}, ${status.limits.max_model_calls} model calls per run.`;
      app.replaceChildren(
        el("section", { class: "grid" }, [
          el("div", {}, [
            el("p", { class: "muted" }, ["SLAY HACKS · gate 1, in the browser"]),
            el("h1", {}, ["Paste a public repository. Read the verdict, the quote, and the hash."]),
            el("p", { class: "lede" }, ["PhoenixRepo checks whether an abandoned idea already exists in a maintained form. The model proposes. Code keeps a quote only when the words are in the cited text."]),
            form,
            note,
            log,
            el("div", { class: "chips" }, examples.map((card) => el("a", { class: "chip", href: "/pro/r/" + card.id }, [card.verdict + " · " + card.repo_id]))),
          ]),
          el("aside", { class: "panel" }, [
            el("h2", {}, ["This process"]),
            el("p", {}, [mode]),
            el("p", { class: "muted" }, ["A repeat of the same repository and commit is served from the cache and spends no model call and no daily slot."]),
          ]),
        ]),
        responsibleBlock(null),
      );
    }

    async function startRun(url, log, note, button) {
      button.disabled = true;
      note.textContent = "";
      log.replaceChildren();
      let response;
      try {
        response = await fetch("/pro/api/runs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
      } catch (error) {
        note.textContent = "The request did not leave this page.";
        button.disabled = false;
        return;
      }
      const data = await response.json();
      button.disabled = false;
      if (!response.ok) {
        note.textContent = (data.error && data.error.message) || "The run was refused.";
        note.className = "error";
        return;
      }
      note.className = "muted";
      if (data.status === "done" && (data.result_id || data.id)) {
        location.href = "/pro/r/" + (data.result_id || data.id);
        return;
      }
      if (data.status === "demo") {
        note.textContent = data.message || "Demo mode.";
        return;
      }
      watch(data.id, log, note);
    }

    function watch(id, log, note) {
      let finished = false;
      const source = new EventSource("/pro/api/runs/" + id + "/events");
      source.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.message) log.append(el("li", {}, [data.message]));
        if (data.type !== "done" && !(data.type === "status" && data.status && data.status !== "running")) return;
        finished = true;
        source.close();
        if (data.status === "error") note.textContent = data.message || "Judging stopped.";
        else if (data.result_id) location.href = "/pro/r/" + data.result_id;
      };
      source.onerror = () => {
        source.close();
        if (!finished) poll(id, log, note);
      };
    }

    async function poll(id, log, note) {
      for (let i = 0; i < 120; i += 1) {
        const data = await fetch("/pro/api/runs/" + id).then((r) => r.json());
        log.replaceChildren(...(data.events || []).map((event) => el("li", {}, [event.message || event.type])));
        if (data.status === "done" && data.result_id) {
          location.href = "/pro/r/" + data.result_id;
          return;
        }
        if (data.status === "error") {
          note.textContent = data.error || "Judging stopped.";
          return;
        }
        await new Promise((resolve) => setTimeout(resolve, 800));
      }
    }

    async function renderResult(id, view) {
      app.replaceChildren(el("p", { class: "muted" }, ["Loading the result"]));
      const response = await fetch("/pro/api/results/" + encodeURIComponent(id));
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        app.replaceChildren(el("p", { class: "error" }, [(body.error && body.error.message) || "This result is not on this server."]));
        return;
      }
      const result = await response.json();
      if (view === "rescue") app.replaceChildren(rescueView(result));
      else if (view === "trace") app.replaceChildren(traceView(result));
      else app.replaceChildren(verdictView(result), responsibleBlock(result));
    }

    function verdictView(result) {
      const links = el("p", {}, [
        el("a", { href: "/pro/r/" + result.id + "/rescue" }, ["Rescue plan"]),
        " · ",
        el("a", { href: "/pro/r/" + result.id + "/trace" }, ["Trace"]),
        " · ",
        el("button", { class: "btn secondary", type: "button", onclick: () => navigator.clipboard.writeText(location.origin + "/pro/r/" + result.id) }, ["Copy permalink"]),
      ]);
      const alts = (result.alternatives || []).length
        ? (result.alternatives || []).map(altCard)
        : [el("p", { class: "muted" }, ["No alternative quote was stored on this verdict."])];
      return el("article", { class: "stack" }, [
        el("p", { class: "muted" }, [result.repo_id + (result.source ? " · " + result.source : "")]),
        el("div", { class: "stamp " + result.verdict }, [result.verdict || "NO VERDICT"]),
        el("h1", {}, [result.title || result.repo_id]),
        el("p", { class: "muted" }, [quoteLabel(result)]),
        el("blockquote", {}, [result.quote || "No quote was stored with this verdict."]),
        el("p", {}, [result.reason || ""]),
        links,
        el("section", { class: "panel" }, [
          el("h2", {}, ["Prior art"]),
          ...alts,
        ]),
        el("p", { class: "hash muted" }, ["Run hash ", result.run_hash || "none"]),
      ]);
    }

    function quoteLabel(result) {
      const blocked = (result.alternatives || []).some((row) => row.blocked && row.quote);
      if (!result.quote) return "";
      return blocked ? "Quote that blocked the repository" : "Quoted evidence stored with the verdict";
    }

    function altCard(row) {
      const label = (row.name || row.url || "alternative").replace(/^web:/, "");
      const name = row.url ? el("a", { href: row.url }, [label]) : el("span", {}, [label]);
      return el("div", { class: "alt" }, [
        el("div", { class: "tag " + (row.blocked ? "blocked" : "open") }, [row.blocked ? "BLOCKED THE REPOSITORY" : "CHECKED, DID NOT BLOCK"]),
        el("div", {}, [name, " · " + (row.overlap || "overlap not recorded")]),
        el("blockquote", {}, [row.quote || "No quote stored."]),
        el("p", { class: "muted" }, [row.reason || ""]),
      ]);
    }

    function rescueView(result) {
      const back = el("p", {}, [el("a", { href: "/pro/r/" + result.id }, ["Back to the verdict"])]);
      if (!result.rescue) {
        return el("article", {}, [
          back,
          el("h1", {}, ["No rescue plan"]),
          el("p", {}, [result.rescue_note || "A rescue plan is written only for a CANDIDATE."]),
          el("blockquote", {}, [result.quote || ""]),
        ]);
      }
      const stages = result.rescue.stages || [];
      return el("article", { class: "stack" }, [
        back,
        el("h1", {}, ["Rescue plan"]),
        el("p", { class: "muted" }, [result.rescue_note || ("Drafted by " + (result.rescue.drafted_by || "the engine"))]),
        el("div", { class: "cols" }, stages.map(stageCard)),
      ]);
    }

    function stageCard(stage) {
      const items = stage.items || [];
      const body = items.length ? items.map((item) => el("div", { class: "item" }, [
        el("h3", {}, [item.title || "Item"]),
        el("p", {}, [item.why || ""]),
        el("blockquote", {}, [item.quote || ""]),
        el("p", { class: "mono muted" }, [(item.evidence || []).join(", ")]),
      ])) : [el("p", { class: "muted" }, ["No verified item in this stage."])];
      return el("section", { class: "panel" }, [el("h2", {}, [stage.stage]), ...body]);
    }

    function traceView(result) {
      const out = el("p", { class: "muted" }, ["Not verified yet."]);
      const list = el("div", { class: "timeline" });
      (result.trace || []).forEach((event) => {
        list.append(el("article", {}, [
          el("strong", { class: "mono" }, [event.action || "event"]),
          el("div", { class: "muted" }, [event.detail || ""]),
          el("div", { class: "hash muted" }, [(event.line_hash || "").slice(0, 16)]),
        ]));
      });
      const verify = el("button", { class: "btn", type: "button", onclick: () => checkChain(result.trace || [], out, false) }, ["Verify SHA-256"]);
      const tamper = el("button", { class: "btn secondary", type: "button", onclick: () => checkChain(result.trace || [], out, true) }, ["Tamper one line"]);
      return el("article", { class: "stack" }, [
        el("p", {}, [el("a", { href: "/pro/r/" + result.id }, ["Back to the verdict"])]),
        el("h1", {}, ["Trace"]),
        el("p", {}, ["Each line hash is SHA-256 of the canonical JSON, with line_hash itself left out. The next line’s prev_hash has to equal it. Tamper changes a copy in this browser."]),
        el("div", { class: "chips" }, [verify, tamper]),
        out,
        el("section", { class: "panel" }, [list]),
      ]);
    }

    async function sha256(text) {
      const bytes = new TextEncoder().encode(text);
      const digest = await crypto.subtle.digest("SHA-256", bytes);
      return [...new Uint8Array(digest)].map((part) => part.toString(16).padStart(2, "0")).join("");
    }

    async function checkChain(events, out, tamper) {
      const copy = events.map((event) => ({ ...event }));
      if (tamper && copy.length) {
        const index = Math.min(1, copy.length - 1);
        copy[index] = { ...copy[index], canonical: copy[index].canonical + "x" };
      }
      let previous = "";
      let broken = "";
      for (let i = 0; i < copy.length; i += 1) {
        const event = copy[i];
        if ((event.prev_hash || "") !== previous) {
          broken = "Line " + (i + 1) + " prev_hash does not match the previous line.";
          break;
        }
        const digest = await sha256(event.canonical || "");
        if (digest !== event.line_hash) {
          broken = "Line " + (i + 1) + " hash does not match. Computed " + digest.slice(0, 12) + ".";
          break;
        }
        previous = event.line_hash;
      }
      if (!copy.length) broken = "This result has no trace lines.";
      out.className = broken ? "bad" : "ok";
      out.textContent = broken
        ? (tamper ? "Tamper detected, as it should be. " : "Chain failed. ") + broken
        : "Chain matches. Run hash " + previous + ".";
    }

    function responsibleBlock(result) {
      const duty = result && result.responsibility ? result.responsibility : null;
      const model = duty ? duty.model_decides : [
        "What the repository’s problem and user are.",
        "Whether a found alternative is the same job.",
        "A draft rescue plan, after code has already called the verdict CANDIDATE.",
      ];
      const code = duty ? duty.code_decides : [
        "A quote is kept only when it is found in the cited text.",
        "Injection text in a README is removed before the model sees it.",
        "The hash chain, the call cap, and the daily run caps.",
      ];
      const limits = duty ? duty.limitations : [
        "A verified quote is not a claim that the verdict is the one a human would write.",
        "The scored set had four false passes, named in the result for the invoice example and in docs/JUDGES.md.",
      ];
      const box = el("div", { class: "panel", id: "injection" });
      const button = el("button", { class: "btn", type: "button", onclick: () => loadInjection(box) }, ["Run the injection demo"]);
      const human = result && result.human_label && result.human_label.why
        ? el("p", {}, ["Human label: " + result.human_label.why])
        : el("p", { class: "muted" }, ["Open the invoice example to see a recorded false pass next to the human label."]);
      return el("section", { class: "stack", id: "responsible" }, [
        el("h2", {}, ["Responsible AI"]),
        el("div", { class: "grid" }, [
          el("section", { class: "panel" }, [el("h3", {}, ["The model decides"]), ...model.map((line) => el("p", {}, [line]))]),
          el("section", { class: "panel" }, [el("h3", {}, ["Code decides"]), ...code.map((line) => el("p", {}, [line]))]),
        ]),
        human,
        el("section", { class: "panel" }, [
          el("h3", {}, ["Known limits"]),
          ...limits.map((line) => el("p", {}, [line])),
          el("p", {}, [(duty && duty.verify || []).join(" ")]),
        ]),
        el("section", { class: "panel" }, [
          el("h3", {}, ["Prompt injection"]),
          el("p", {}, ["A README can contain instructions aimed at the model. The detector is code, not a model. Matching spans are replaced before the judge stores the README. This demo uses a fixture, not a live repository."]),
          button,
          box,
          result && result.injection ? el("p", { class: "muted" }, [injectionSentence(result.injection)]) : el("span"),
        ]),
      ]);
    }

    function injectionSentence(report) {
      if (report.note) return report.note;
      if (report.detected) return "This run removed " + report.count + " injection span(s) before the model saw the README.";
      return "This run’s README did not match the injection detector.";
    }

    async function loadInjection(box) {
      const data = await fetch("/pro/api/injection-demo", { method: "POST" }).then((r) => r.json());
      const names = (data.report.findings || []).map((item) => item.pattern).join(", ");
      box.replaceChildren(
        el("p", {}, ["Detected " + data.report.count + ": " + names]),
        el("h3", {}, ["Before"]),
        el("pre", { class: "mono" }, [data.original]),
        el("h3", {}, ["After, the text the model is allowed to see"]),
        el("pre", { class: "mono" }, [data.neutralised]),
      );
    }

    route();
  </script>
</body>
</html>
